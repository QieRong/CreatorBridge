<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CreatorBridge 多平台内容适配发布助手 - 写一次，到处发。">
  <title>CreatorBridge - 多平台内容适配发布编排</title>
  <link rel="stylesheet" href="src/css/style.css">
</head>
<body>

  <!-- ===== 顶部导航栏 ===== -->
  <header class="app-header" id="app-header">
    <div class="header-container">
      <div class="header-left">
        <div class="logo-area">
          <h1 class="logo-text">CreatorBridge</h1>
          <span class="header-subtitle">多平台内容适配与发布编排</span>
        </div>
        <div class="header-badge">
          <span class="badge badge-mock" id="mode-badge">Mock 模式</span>
        </div>
      </div>
      <div class="header-right">
        <button class="btn btn-ghost" id="btn-settings" title="连接器设置">⚙️ 设置</button>
        <button class="btn btn-ghost" id="btn-save-draft" title="保存草稿">保存草稿</button>
        <button class="btn btn-primary" id="btn-adapt" title="一键生成平台适配结果">一键适配</button>
        <button class="btn btn-success" id="btn-publish" title="模拟发布到选中的平台" disabled>模拟发布</button>
        <button class="btn btn-secondary" id="btn-export-pkg" title="导出发布包(含JSON)" disabled>下载发布包</button>
      </div>
    </div>
  </header>

  <!-- ===== 顶部数据统计栏 ===== -->
  <div class="stats-bar">
    <div class="stats-container">
      <div class="stat-card">
        <div class="stat-label">已选平台</div>
        <div class="stat-value"><span id="stat-platforms">0</span> <span class="stat-unit">/ 5</span></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">上传素材</div>
        <div class="stat-value"><span id="stat-media">0</span> <span class="stat-unit">个</span></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">队列任务</div>
        <div class="stat-value"><span id="stat-queue">0</span> <span class="stat-unit">待执行</span></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">当前状态</div>
        <div class="stat-value stat-status">本地验证中</div>
      </div>
    </div>
  </div>

  <main class="app-main">
    <div class="workspace-grid">

      <!-- ===== 左栏：内容输入与管理 ===== -->
      <aside class="workspace-left">
        <section class="panel">
          <div class="panel-header">
            <h2 class="panel-title">内容编辑</h2>
          </div>
          <div class="panel-body">
            <div class="form-group">
              <label class="form-label" for="input-title">文章标题 <span class="required">*</span></label>
              <input type="text" class="form-input" id="input-title" placeholder="请输入文章标题" maxlength="100">
              <div class="input-hint" id="title-counter">0 / 100</div>
            </div>
            
            <div class="form-group">
              <label class="form-label" for="input-body">正文内容 <span class="required">*</span></label>
              <textarea class="form-textarea" id="input-body" placeholder="请输入正文..." rows="12"></textarea>
              <div class="input-stats">
                <span id="body-counter">字数统计: 0 字</span>
                <span id="read-time">预计阅读: 0 分钟</span>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="input-tags">标签</label>
              <input type="text" class="form-input" id="input-tags" placeholder="如：学习, 效率工具">
            </div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h2 class="panel-title">媒体素材</h2>
            <span class="panel-desc">仅限本地预览，不上传</span>
          </div>
          <div class="panel-body">
            <div class="media-upload-wrapper">
              <input type="file" id="input-media" class="form-file-input" accept="image/*,video/*" multiple title="选择本地图片或视频">
              <label for="input-media" class="form-file-btn">📂 选择图片或视频</label>
            </div>
            <div id="media-preview-container" class="media-preview-container"></div>
          </div>
        </section>
        
        <section class="panel">
          <div class="panel-header">
            <h2 class="panel-title">平台选择</h2>
          </div>
          <div class="panel-body">
            <div class="platform-selector" id="platform-selector">
              <!-- JS 动态生成 -->
            </div>
          </div>
        </section>
      </aside>

      <!-- ===== 中栏：平台适配与预览 ===== -->
      <section class="workspace-middle">
        <div class="panel h-full flex-col">
          <div class="panel-header tab-header">
            <div class="tabs" id="platform-tabs">
              <div class="tab-empty-hint">请在左侧勾选平台</div>
              <!-- JS 动态生成 Tabs -->
            </div>
          </div>
          <div class="panel-body tab-content-area" id="tab-content-area">
            <div class="empty-state" id="preview-empty">
              <div class="empty-icon">📱</div>
              <p>请在左侧输入内容并点击“一键适配”</p>
            </div>
            <!-- JS 动态生成的预览卡片将放置在此，按平台ID区分 -->
          </div>
        </div>
      </section>

      <!-- ===== 右栏：发布控制台 ===== -->
      <aside class="workspace-right">
        
        <section class="panel">
          <div class="panel-header">
            <h2 class="panel-title">发布任务队列</h2>
          </div>
          <div class="panel-body">
            <div class="queue-list" id="queue-list">
              <div class="empty-state">
                <p>暂无任务</p>
              </div>
            </div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h2 class="panel-title">发布负载 (Payload)</h2>
            <button class="btn btn-icon btn-sm" id="btn-copy-payload" title="复制完整 Payload JSON" disabled>📄 复制</button>
          </div>
          <div class="panel-body">
            <div class="payload-preview-container">
              <pre class="payload-pre"><code id="payload-code">无载荷数据</code></pre>
            </div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h2 class="panel-title">最近历史 (Mock)</h2>
            <button class="btn btn-ghost btn-sm" id="btn-clear-history">清空</button>
          </div>
          <div class="panel-body history-body">
            <div class="history-list" id="history-list">
              <div class="empty-state" id="history-empty">
                <p>暂无发布历史</p>
              </div>
            </div>
          </div>
        </section>

      </aside>

    </div>
  </main>

  <div class="toast-container" id="toast-container"></div>
  
  <button class="back-to-top" id="back-to-top" title="回到顶部" aria-label="回到顶部">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 19V5M12 5L5 12M12 5L19 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <script src="src/js/utils.js"></script>
  <script src="src/js/models.js"></script>
  <script src="src/js/platforms.js"></script>
  <script src="src/js/adapters.js"></script>
  <script src="src/js/validator.js"></script>
  <script src="src/js/publisher.js"></script>
  <script src="src/js/storage.js"></script>
  <script src="src/js/main.js"></script>

  <!-- ========================================== -->
  <!-- 连接器设置模态框 (Modal) -->
  <!-- ========================================== -->
  <div class="modal-overlay" id="connector-modal" style="display: none;">
    <div class="modal-container">
      <div class="modal-header">
        <h3 class="modal-title">中转连接器设置</h3>
        <button class="modal-close" id="btn-close-modal">✕</button>
      </div>
      <div class="modal-body">
        <p class="modal-desc">启用连接器后，发布载荷将投递至您自建的后端服务。请勿在公共环境输入敏感 Token。</p>
        
        <div class="form-group" style="margin-bottom: 8px;">
          <label class="form-label" style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:14px; color:var(--text-primary);">
            <input type="checkbox" id="toggle-connector" style="width:16px; height:16px; accent-color:var(--color-primary);">
            启用真实连接器投递模式
          </label>
        </div>
        
        <div class="form-group">
          <label class="form-label" for="input-base-url">连接器 Base URL</label>
          <input type="text" class="form-input" id="input-base-url" placeholder="例如：https://api.yourdomain.com" disabled>
        </div>
        
        <div class="form-group">
          <label class="form-label" for="input-runtime-token">运行时鉴权 Token (Runtime Token)</label>
          <input type="password" class="form-input" id="input-runtime-token" placeholder="Bearer Token (仅保存在当前内存)" disabled>
          <div class="input-hint" style="color:var(--color-warning);">刷新页面即失效，不会保存到本地存储。</div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="btn-test-connection" disabled>测试连接</button>
        <button class="btn btn-primary" id="btn-save-settings">保存配置</button>
      </div>
    </div>
  </div>
</body>
</html>
